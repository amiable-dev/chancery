# OpenSSF Scorecard (ADR-011). Publishing requires a public repo; the precheck
# guard is fail-closed and permanent — on flip day it starts passing, it is
# not deleted. workflow_dispatch runs a no-publish dry run on the private repo
# so flip day is not this workflow's first execution.

name: scorecard

on:
  schedule:
    - cron: '30 1 * * 6'   # weekly, Saturday 01:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      visibility: ${{ steps.vis.outputs.visibility }}
    steps:
      - id: vis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" >> "$GITHUB_OUTPUT"

  analysis:
    name: Scorecard analysis
    needs: precheck
    if: needs.precheck.outputs.visibility == 'public' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ needs.precheck.outputs.visibility == 'public' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5   # diagnostic only; the published score is the durable output
          if-no-files-found: warn
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        if: needs.precheck.outputs.visibility == 'public'
        with:
          sarif_file: results.sarif
