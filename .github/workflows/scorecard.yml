# OpenSSF Scorecard (ADR-011). Publishing requires a public repo; the precheck
# guard is fail-closed and permanent — on flip day it starts passing, it is
# not deleted. workflow_dispatch runs a no-publish dry run on the private repo
# so flip day is not this workflow's first execution.

name: scorecard

on:
  schedule:
    - cron: '30 1 * * 6'   # weekly, Saturday 01:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      visibility: ${{ steps.vis.outputs.visibility }}
    steps:
      - id: vis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" >> "$GITHUB_OUTPUT"

  analysis:
    name: Scorecard analysis
    needs: precheck
    if: needs.precheck.outputs.visibility == 'public' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ needs.precheck.outputs.visibility == 'public' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5   # diagnostic only; the published score is the durable output
          if-no-files-found: warn
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        if: needs.precheck.outputs.visibility == 'public'
        with:
          sarif_file: results.sarif
