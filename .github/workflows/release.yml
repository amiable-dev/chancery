# Release pipeline (ADR-011 §7 / operations.md): a tag vX.Y.Z produces a
# GitHub release carrying the npm tarball + CycloneDX SBOM, a GitHub-native
# SLSA provenance attestation for the tarball, and an npm publish with
# --provenance. Publishing uses npm TRUSTED PUBLISHING (GitHub Actions OIDC,
# configured on the package's npmjs.com settings for this repo + this
# workflow filename) — no token, no secret; the runbook is in
# docs/operations.md.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # create the GitHub release
      id-token: write        # OIDC for npm --provenance and the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # no dependency cache in a publishing workflow: a poisoned cache
          # entry must never be able to influence a shipped artifact (zizmor
          # cache-poisoning, high)
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts

      # The gate runs before anything ships — a release is not exempt.
      - name: Gate
        run: npm test && node .kb/bin/kb.mjs verify --format json > /dev/null

      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          V="$(node -p "require('./package.json').version")"
          [ "v$V" = "$TAG" ] || { echo "tag $TAG != package version v$V"; exit 1; }

      - name: Pack
        id: pack
        run: echo "tarball=$(npm pack --json | node -p "JSON.parse(require('fs').readFileSync(0)).at(0).filename")" >> "$GITHUB_OUTPUT"

      - name: SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-file sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ${{ steps.pack.outputs.tarball }}
            sbom.cdx.json
          generate_release_notes: true

      - name: Publish to npm (trusted publishing, with provenance)
        # OIDC-minted credentials via the trusted publisher registered for
        # release.yml in this repo; needs npm >= 11.5 (Node 24 bundles it).
        run: |
          npm --version | awk -F. '($1 > 11) || ($1 == 11 && $2 >= 5) { ok = 1 } END { exit !ok }' \
            || { echo "npm $(npm --version) lacks trusted-publishing support (need >= 11.5)"; exit 1; }
          npm publish --provenance --access public
